<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0e18">
<title>Kali Lab · Práctica de comandos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --top:34px; --dock:64px;
  --accent:#2f81f7; --accent2:#6cb6ff;
  --win:#1a1c26; --title:#232633; --border:#323850;
  --txt:#e6e8ef; --muted:#8a93a8;
  --term:#0b0d14;
  --green:#4ade80; --red:#f87171; --yellow:#fbbf24; --blue:#60a5fa; --cyan:#22d3ee; --purple:#c084fc;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{height:100dvh}
button{font:inherit;color:inherit}

/* ---------- Barra superior ---------- */
#topbar{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:rgba(9,11,19,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #1d2232;z-index:3000;font-size:13px}
.tb-group{display:flex;align-items:center;gap:2px;min-width:0}
.tb-btn{background:none;border:0;padding:5px 9px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tb-btn:hover,.tb-btn[aria-expanded="true"]{background:#ffffff14}
.logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#2f81f7,#8b5cf6);display:grid;place-items:center;flex:none}
.logo svg{width:12px;height:12px}
.gem-dot{width:8px;height:8px;border-radius:50%;background:#5b6378;flex:none}
.gem-dot.on{background:var(--green);box-shadow:0 0 8px #4ade80aa}
#clock{font-variant-numeric:tabular-nums;color:#cfd5e3}
#appmenu{position:fixed;top:calc(var(--top) + 6px);left:8px;width:250px;background:#1b1e2b;border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 18px 50px #000b;z-index:3100;display:none}
#appmenu.open{display:block}
#appmenu .mi{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px}
#appmenu .mi:hover{background:#ffffff12}
#appmenu .mi .ic{width:28px;height:28px}
#appmenu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
#appmenu .note{font-size:11.5px;color:var(--muted);padding:4px 10px 6px;line-height:1.4}

/* ---------- Escritorio ---------- */
#desktop{position:fixed;top:var(--top);left:0;right:0;bottom:0;overflow:hidden;
  background:
    radial-gradient(1100px 640px at 12% 8%, #1e3a7044, transparent 60%),
    radial-gradient(900px 600px at 88% 92%, #5b21b644, transparent 60%),
    radial-gradient(600px 400px at 70% 20%, #0e749033, transparent 60%),
    linear-gradient(160deg,#070b16 0%,#0a1121 50%,#05070d 100%);}
#desktop::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);pointer-events:none}
#wm{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;user-select:none;width:90%}
#wm .big{font-family:var(--mono);font-weight:700;font-size:clamp(34px,7vw,84px);letter-spacing:.08em;background:linear-gradient(90deg,#6cb6ff55,#c084fc55);-webkit-background-clip:text;background-clip:text;color:transparent}
#wm .small{font-size:clamp(12px,1.6vw,15px);color:#8a93a877;letter-spacing:.3em;text-transform:uppercase;margin-top:6px}
#icons{position:absolute;top:18px;left:18px;display:flex;flex-direction:column;gap:12px;z-index:1}
.icon{width:100px;padding:10px 4px 8px;border-radius:12px;text-align:center;cursor:pointer;user-select:none;border:1px solid transparent;background:none;font-size:12.5px;line-height:1.25;text-shadow:0 1px 3px #000}
.icon:hover,.icon:focus-visible{background:#ffffff10;border-color:#ffffff1c;outline:none}
.icon .ic{width:58px;height:58px;margin:0 auto 7px}
.ic svg{width:100%;height:100%;display:block}
#windows{position:absolute;inset:0;z-index:2;pointer-events:none}
#windows > *{pointer-events:auto}

/* ---------- Ventanas ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 70px #000c,0 0 0 1px #0007;overflow:hidden;min-width:320px;min-height:240px;resize:both;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.win.focused{border-color:#4b5578}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--dock) - 14px)!important;border-radius:0;resize:none}
.win.min{display:none}
.win-title{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:var(--title);border-bottom:1px solid var(--border);cursor:grab;user-select:none;touch-action:none;font-size:13px}
.win-title:active{cursor:grabbing}
.win-title .wi{width:18px;height:18px;flex:none}
.win-title .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9cfdf;font-weight:500}
.wbtn{width:30px;height:28px;border-radius:7px;border:0;background:transparent;color:#a8b0c4;cursor:pointer;display:grid;place-items:center;flex:none}
.wbtn:hover{background:#ffffff16;color:#fff}
.wbtn.close:hover{background:#e5484d;color:#fff}
.wbtn svg{width:14px;height:14px}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- Dock ---------- */
#dock{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(14,17,27,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #262c40;border-radius:16px;z-index:2500;box-shadow:0 10px 40px #0009}
.dk{position:relative;width:46px;height:46px;border-radius:11px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:5px}
.dk:hover{background:#ffffff12}
.dk .ic{width:36px;height:36px}
.dk::after{content:"";position:absolute;bottom:1px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:transparent}
.dk.open::after{background:var(--accent2)}
.dk .tip{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);background:#0d1018;border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.dk:hover .tip{opacity:1}

/* ---------- Terminal ---------- */
.term{flex:1;display:flex;flex-direction:column;background:var(--term);min-height:0}
.taskbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 12px;background:linear-gradient(90deg,#11203d,#1c1534);border-bottom:1px solid #26304e;font-size:13px}
.task-main{flex:1 1 260px;min-width:0;display:flex;gap:10px;align-items:flex-start}
.task-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;font-size:17px;flex:none}
.task-lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);font-weight:700;display:flex;gap:8px;align-items:center}
.badge{font-size:10px;padding:1px 6px;border-radius:99px;background:#ffffff14;color:#cbd2e1;letter-spacing:.02em;text-transform:none;font-weight:600}
.badge.g{background:#4ade8022;color:var(--green)}
.task-txt{margin-top:2px;line-height:1.4;color:#f3f4f8;font-weight:500;word-break:break-word}
.task-side{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tbtn{background:#ffffff10;border:1px solid #ffffff20;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.tbtn:hover{background:#ffffff1c}
.score{display:flex;gap:6px;font-family:var(--mono);font-size:12.5px}
.score span{padding:4px 8px;border-radius:8px;background:#00000040}
.score .s-ok{color:var(--green)} .score .s-bad{color:var(--red)}
.screen{flex:1;overflow-y:auto;padding:10px 14px 16px;font-family:var(--mono);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;cursor:text;outline:none;scrollbar-width:thin;scrollbar-color:#2b3247 transparent}
.screen::-webkit-scrollbar{width:9px} .screen::-webkit-scrollbar-thumb{background:#2b3247;border-radius:9px}
.line{min-height:1.5em}
.pl{color:#3b8eea}.pu{color:#5aa9ff;font-weight:700}.pp{color:#f1f3f8;font-weight:700}.pr{color:#ff5c5c;font-weight:700}
.err{color:#ff7b7b}.ok{color:var(--green)}.dim{color:var(--muted)}.warn{color:var(--yellow)}.info{color:var(--cyan)}
.c-dir{color:#5aa9ff;font-weight:700}.c-exe{color:#4ade80;font-weight:700}.c-hid{color:#9aa3b6}
.hl{color:#ff6b6b;font-weight:700}
.head{color:var(--accent2);font-weight:700}
.profe{display:block;margin:8px 0 6px;padding:8px 12px;border-left:3px solid var(--yellow);background:#fbbf2412;color:#fde68a;border-radius:0 8px 8px 0;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
.profe b{color:#fff}
.verdict{display:block;margin:6px 0;padding:7px 12px;border-radius:8px;font-family:Inter,system-ui,sans-serif;font-size:13.5px;line-height:1.45}
.verdict.ok{background:#4ade8018;border:1px solid #4ade8040}
.verdict.err{background:#f8717118;border:1px solid #f8717140;color:#fecaca}
.verdict.info{background:#22d3ee14;border:1px solid #22d3ee38;color:#a5f3fc}
.verdict.hint{background:#c084fc14;border:1px solid #c084fc38;color:#e9d5ff}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.inwrap .row{display:flex;align-items:baseline}
.inwrap input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);font:inherit;padding:0;margin:0;caret-color:var(--green)}
.keys{display:none;flex:none;gap:6px;padding:7px 8px;background:#0f121c;border-top:1px solid #1e2436;overflow-x:auto;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:none;min-width:42px;height:36px;padding:0 10px;border-radius:8px;border:1px solid #2a3148;background:#181c29;font-family:var(--mono);font-size:13px;cursor:pointer}
.keys button:active{background:#262c40}
.keys .k-wide{min-width:64px}
.keys .k-red{color:#fca5a5}

/* ---------- Editor de texto ---------- */
.editor{flex:1;display:flex;flex-direction:column;min-height:0;background:#1e2030}
.menubar{flex:none;display:flex;gap:2px;padding:3px 6px;background:#232637;border-bottom:1px solid var(--border);font-size:12.5px;color:#b8bfd0;overflow-x:auto;align-items:center}
.menubar span{padding:3px 8px;border-radius:5px;white-space:nowrap}
.menubar .sp{flex:1}
.menubar button{background:#ffffff10;border:1px solid #ffffff1c;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
.menubar button:hover{background:#ffffff1c}
.edwrap{flex:1;min-height:0;display:flex;overflow:auto;font-family:var(--mono);font-size:var(--edfs,13.5px);line-height:1.55}
.gutter{flex:none;padding:10px 10px 10px 8px;text-align:right;color:#565e78;user-select:none;background:#1a1c2a;border-right:1px solid #2a2e42;white-space:pre}
.edtext{flex:1;margin:0;padding:10px 14px;white-space:pre-wrap;word-break:break-word;color:#e3e6ee;outline:none;border:0;background:transparent;font:inherit;resize:none;min-width:0}
textarea.edtext{white-space:pre;overflow:hidden}
.status{flex:none;display:flex;justify-content:space-between;gap:10px;padding:4px 10px;font-size:11.5px;color:var(--muted);background:#191b28;border-top:1px solid var(--border)}

/* ---------- Ajustes ---------- */
.settings{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;font-size:14px;line-height:1.5}
.settings h2{margin:0;font-size:18px}
.settings p{margin:0;color:#b9c0d0}
.settings label{display:block;font-size:12.5px;font-weight:600;color:#cdd3e2;margin-bottom:6px}
.settings input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:#11131c;color:var(--txt);font:inherit;font-family:var(--mono);font-size:14px;outline:none}
.settings input:focus{border-color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:9px;border:1px solid #ffffff22;background:#ffffff10;cursor:pointer;font-weight:600;font-size:13.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.12)}
.card{padding:12px 14px;border-radius:10px;background:#11131c;border:1px solid var(--border);font-size:13px;color:#aeb6c8}
.card a{color:var(--accent2)}
.state{font-size:13px;font-weight:600}
.state.on{color:var(--green)} .state.off{color:var(--muted)}

/* ---------- Diálogos Zenity ---------- */
.zen-ov{position:absolute;inset:0;display:grid;place-items:center;background:#0008;z-index:99999;padding:14px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.zen{width:min(400px,100%);background:#2b2e3b;border:1px solid #474e66;border-radius:12px;box-shadow:0 24px 60px #000c;overflow:hidden;font-size:14px;animation:pop .16s ease-out}
.zen-t{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#33374a;font-size:13px;font-weight:600;color:#dfe3ee}
.zen-t small{font-weight:500;color:var(--muted);font-size:11px}
.zen-b{padding:18px 18px 8px;display:flex;gap:14px;align-items:flex-start}
.zen-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background:#ffffff12}
.zen-c{flex:1;min-width:0;line-height:1.45;word-break:break-word}
.zen-c input{width:100%;margin-top:10px;padding:9px 10px;border-radius:7px;border:1px solid #4b5370;background:#1d1f2a;color:var(--txt);font:inherit;outline:none}
.zen-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px 14px}
.zen-f button{padding:8px 16px;border-radius:8px;border:1px solid #ffffff26;background:#ffffff12;cursor:pointer;font-weight:600}
.zen-f button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.zen-f button:disabled{opacity:.45;cursor:default}
.zbar{height:12px;border-radius:9px;background:#1b1d27;margin-top:12px;overflow:hidden;border:1px solid #444b63}
.zbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f81f7,#6cb6ff);transition:width .1s linear}
.zlist{margin-top:10px;max-height:220px;overflow:auto;border:1px solid #444b63;border-radius:8px}
.zlist table{width:100%;border-collapse:collapse;font-size:13px}
.zlist th{text-align:left;padding:6px 10px;background:#33374a;position:sticky;top:0;font-weight:600}
.zlist td{padding:7px 10px;border-top:1px solid #383d52;cursor:pointer}
.zlist tr.sel td{background:#2f81f7;color:#fff}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#141826;border:1px solid var(--border);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 12px 40px #000a;opacity:0;pointer-events:none;transition:.25s;z-index:4000;max-width:min(92vw,460px);text-align:center;line-height:1.45}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Móvil ---------- */
@media (max-width:760px){
  :root{--dock:62px}
  .tb-hide-m{display:none!important}
  #icons{left:0;right:0;top:22px;flex-direction:row;justify-content:center;flex-wrap:wrap;gap:14px}
  .icon{width:96px}
  #wm{top:58%}
  .win{position:absolute;left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--dock))!important;border-radius:0;resize:none;border-left:0;border-right:0;min-width:0}
  .win-title{cursor:default}
  .wbtn.max-b{display:none}
  #dock{left:0;right:0;bottom:0;transform:none;border-radius:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-left:0;border-right:0;border-bottom:0}
  .dk .tip{display:none}
  .keys{display:flex}
  .screen{font-size:12px;padding:8px 10px 12px}
  .taskbar{padding:8px 10px}
  .task-av{width:28px;height:28px;font-size:15px}
  #toast{bottom:auto;top:calc(var(--top) + 10px);transform:translateX(-50%) translateY(-12px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="topbar">
  <div class="tb-group">
    <button class="tb-btn" id="btnMenu" aria-expanded="false" aria-haspopup="true">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l6 5-6 5M13 18h6"/></svg></span>
      <span>Aplicaciones</span>
    </button>
    <button class="tb-btn tb-hide-m" data-open="prac">Práctica</button>
    <button class="tb-btn tb-hide-m" data-open="term">Terminal</button>
    <button class="tb-btn tb-hide-m" data-open="txt">comandos.txt</button>
  </div>
  <div class="tb-group">
    <span class="tb-btn" id="clock" aria-live="off"></span>
  </div>
</div>

<div id="appmenu" role="menu">
  <button class="mi" data-open="prac"><span class="ic" data-ic="prac"></span>Práctica (con la profe)</button>
  <button class="mi" data-open="term"><span class="ic" data-ic="term"></span>Terminal libre</button>
  <button class="mi" data-open="txt"><span class="ic" data-ic="txt"></span>comandos.txt</button>
  <hr>
  <div class="note">Atajo: <b>Ctrl + Alt + T</b> abre la terminal.<br>Simulador educativo: nada de lo que escribas afecta a tu equipo.</div>
</div>

<div id="desktop">
  <div id="wm"><div class="big">KALI LAB</div><div class="small">Práctica de comandos · Prog. VI</div></div>
  <div id="icons">
    <button class="icon" data-open="prac"><span class="ic" data-ic="prac"></span>Práctica</button>
    <button class="icon" data-open="term"><span class="ic" data-ic="term"></span>Terminal</button>
    <button class="icon" data-open="txt"><span class="ic" data-ic="txt"></span>comandos.txt</button>
  </div>
  <div id="windows"></div>
</div>

<div id="dock">
  <button class="dk" data-dock="prac" aria-label="Práctica"><span class="ic" data-ic="prac"></span><span class="tip">Práctica con la profe</span></button>
  <button class="dk" data-dock="term" aria-label="Terminal"><span class="ic" data-ic="term"></span><span class="tip">Terminal libre</span></button>
  <button class="dk" data-dock="txt" aria-label="comandos.txt"><span class="ic" data-ic="txt"></span><span class="tip">comandos.txt</span></button>
</div>

<div id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isMobile = () => matchMedia('(max-width: 760px)').matches;
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },

async function headTail(args, ctx, head) {
  let n = 10; const files = [];
  for (let i = 0; i < args.length; i++) { const a = args[i]; if (a === '-n') n = parseInt(args[++i], 10); else if (/^-n\d+$/.test(a)) n = parseInt(a.slice(2), 10); else if (/^-\d+$/.test(a)) n = parseInt(a.slice(1), 10); else files.push(a); }
  if (isNaN(n)) { out(`${head ? 'head' : 'tail'}: número de líneas inválido`, 'err'); return 1; }
  if (!files.length) { if (ctx.stdin != null) { const ls = ctx.stdin.replace(/\n$/, '').split('\n'); (head ? ls.slice(0, n) : ls.slice(Math.max(0, ls.length - n))).forEach(l => out(l)); return 0; } note(`(En el simulador, ${head ? 'head' : 'tail'} necesita un archivo)`); return 1; }
  let code = 0;
  for (const t of files) {
    const abs = resolve(t), node = getNode(abs);
    if (!node || node.t !== 'f') { out(`${head ? 'head' : 'tail'}: cannot open '${t}' for reading: No such file or directory`, 'err'); code = 1; continue; }
    if (denyRead(abs, ctx)) { out(`${head ? 'head' : 'tail'}: cannot open '${t}' for reading: Permission denied`, 'err'); code = 1; continue; }
    const ls = node.d.replace(/\n$/, '').split('\n');
    (head ? ls.slice(0, n) : ls.slice(Math.max(0, ls.length - n))).forEach(l => out(l));
  }
  return code;
}

function openEditorCmd(path, ctx, prog) {

  openEditor(abs, !!ctx.sudo);
  out(`(Se abrió ${pretty(abs)} en el editor. Escribe, pulsa «Guardar» y cierra la ventana.)`, 'dim');

}

/* ---------- apt ---------- */
async function apt(args, ctx) {
  const sub = args[0];
  const pkgs = args.slice(1).filter(a => !a.startsWith('-'));
  const yes = args.includes('-y') || args.includes('--yes');
  if (!sub || sub === '--help' || sub === '-h') {
    outLines('apt 3.0.3 (amd64)\nUsage: apt [options] command\n\nMost used commands:\n  update  - update list of available packages\n  install - install packages\n  remove  - remove packages\n  upgrade - upgrade the system by installing/upgrading packages\n  list    - list packages based on package names'); return 0;
  }
  if (sub === 'list') { out('Listing... Done'); [...state.installed].sort().forEach(p => out(`${p}/kali-rolling,now ${CATALOG[p] || '1.0'} amd64 [installed]`)); return 0; }
  if (sub === 'search') { const q = pkgs[0] || ''; Object.keys(CATALOG).filter(p => p.includes(q)).forEach(p => out(`${p}/kali-rolling ${CATALOG[p]} amd64`)); return 0; }
  if (!['update', 'install', 'remove', 'purge', 'upgrade', 'full-upgrade', 'autoremove'].includes(sub)) { out(`E: Invalid operation ${sub}`, 'err'); return 100; }
  if (!ctx.sudo) {
    out('E: Could not open lock file /var/lib/dpkg/lock-frontend - open (13: Permission denied)', 'err');
    out('E: Unable to acquire the dpkg frontend lock (/var/lib/dpkg/lock-frontend), are you root?', 'err');
    return 100;
  }
  const step = async (t, ms = 260, cls) => { if (!(await pause(ms))) throw new Error('abort'); out(t, cls); };
  try {
    if (sub === 'update') {
      await step('Hit:1 http://http.kali.org/kali kali-rolling InRelease', 350);
      await step('Get:2 http://http.kali.org/kali kali-rolling/main amd64 Packages [20.6 MB]', 600);
      await step('Get:3 http://http.kali.org/kali kali-rolling/contrib amd64 Packages [118 kB]', 300);
      await step('Fetched 20.7 MB in 3s (6,902 kB/s)', 400);
      await step('Reading package lists... Done', 300);
      await step('Building dependency tree... Done', 200);
      await step('Reading state information... Done', 150);
      await step("12 packages can be upgraded. Run 'apt list --upgradable' to see them.", 200);
      state.aptUpdated = true; return 0;
    }
    if (sub === 'upgrade' || sub === 'full-upgrade' || sub === 'autoremove') {
      await step('Reading package lists... Done'); await step('Building dependency tree... Done'); await step('Calculating upgrade... Done', 400);
      await step('0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.'); return 0;
    }
    if (!pkgs.length) { out('E: No packages found', 'err'); return 100; }
    await step('Reading package lists... Done', 300);
    await step('Building dependency tree... Done', 200);
    await step('Reading state information... Done', 150);
    if (sub === 'install') {
      for (const p of pkgs) if (!CATALOG[p] && !BASE_PKGS.includes(p)) { out(`E: Unable to locate package ${p}`, 'err'); return 100; }
      const nuevos = pkgs.filter(p => !state.installed.has(p));
      pkgs.filter(p => state.installed.has(p)).forEach(p => out(`${p} is already the newest version (${CATALOG[p] || '1.0'}).`));
      if (!nuevos.length) { out('0 upgraded, 0 newly installed, 0 to remove and 12 not upgraded.'); return 0; }
      out('The following NEW packages will be installed:'); out('  ' + nuevos.join(' '));
      out(`0 upgraded, ${nuevos.length} newly installed, 0 to remove and 12 not upgraded.`);
      out(`Need to get ${(nuevos.length * 1.7).toFixed(1)} MB of archives.`);
      if (!yes) { const r = await askInput('Do you want to continue? [Y/n] '); if (r === null || /^n/i.test(r.trim())) { out('Abort.'); return 1; } }
      let i = 1;
      for (const p of nuevos) await step(`Get:${i++} http://http.kali.org/kali kali-rolling/main amd64 ${p} amd64 ${CATALOG[p]} [${(Math.random() * 1500 + 200).toFixed(0)} kB]`, 500);
      for (const p of nuevos) { await step(`Selecting previously unselected package ${p}.`, 200); await step(`Unpacking ${p} (${CATALOG[p]}) ...`, 250); await step(`Setting up ${p} (${CATALOG[p]}) ...`, 250); state.installed.add(p); }
      await step('Processing triggers for man-db (2.13.0-1) ...', 300);
      return 0;
    }
    // remove / purge
    const inst = pkgs.filter(p => state.installed.has(p));
    pkgs.filter(p => !state.installed.has(p)).forEach(p => out(`Package '${p}' is not installed, so not removed`));
    if (!inst.length) return 0;
    out('The following packages will be REMOVED:'); out('  ' + inst.join(' '));
    if (!yes) { const r = await askInput('Do you want to continue? [Y/n] '); if (r === null || /^n/i.test(r.trim())) { out('Abort.'); return 1; } }
    for (const p of inst) { await step(`Removing ${p} (${CATALOG[p] || '1.0'}) ...`, 300); state.installed.delete(p); }
    return 0;
  } catch (e) { if (e.message === 'abort') { out('^C'); state.abort = false; return 130; } throw e; }
}

function updateScore() { if (!T.sOk) return; T.sOk.textContent = '✔ ' + state.score.ok; T.sBad.textContent = '✖ ' + state.score.bad; }
function renderTask() {
  const t = state.task; if (!T.taskTxt) return;
  T.taskLbl.replaceChildren(document.createTextNode('Tarea ' + state.taskN), el('span', { class: 'badge', text: TAREAS.length + ' tareas' }));
  T.taskTxt.innerHTML = t ? t.t : '—';
}
function pickLocal() {
  if (!state.deck.length) state.deck = shuffle(TAREAS.map((_, i) => i));
  return { ...TAREAS[state.deck.pop()], src: 'local' };
}
async function nextTask() {
  state.attempts = 0; state.taskLog = [];
  const t = pickLocal();
  state.task = t; state.taskN++;
  const notes = [];
  if (t.src === 'local') {
    const s = S(notes);
    if (!t.keepCwd && state.cwd !== HOME) { s.cd('~'); notes.push('📍 Te regresé a tu carpeta personal (~).'); }
    if (t.setup) t.setup(s);
  }
  renderTask();
  profeMsg(`👩‍🏫 <b>Tarea ${state.taskN}:</b> ${t.t}`);
  notes.forEach(n => block(n, 'line dim'));
}
async function aprobar(msg) {
  state.score.ok++; updateScore();
  block('✅ ' + (msg || rand(['¡Correcto!', 'Correcto, así se hace.', 'Bien hecho.', 'Exacto.'])), 'verdict ok');
  await sleep(650);
  await nextTask();
}
function fallar(comentario) {
  const t = state.task; state.attempts++; state.score.bad++; updateScore();
  block('❌ ' + (comentario || 'No es correcto.'), 'verdict err');
  if (state.attempts === 1 && t.src === 'local') block('💡 Pista: ' + t.pista, 'verdict hint');
  if (state.attempts >= 2 && t.sol) block('🔑 Una forma correcta: ' + t.sol, 'verdict hint');
  block('Inténtalo otra vez, o escribe «pista» o «saltar».', 'line dim');
}
async function evaluar(lastName, lastCode) {
  const t = state.task; if (!t) return;
  {
    const c = C();
    if (t.check(c)) return aprobar();
    if (NEUTRAL.has(lastName) && lastName !== t.cmd) return;
    if (t.pasos > 1 && lastCode === 0 && c.okCount() < t.pasos && new RegExp('(^|[\\s&;])' + lastName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(t.sol)) { block('↪ Bien, sigue con el siguiente paso.', 'verdict info'); return; }
    let msg = lastCode !== 0 && lastCode !== 130 ? 'El comando dio error; lee el mensaje de la terminal.' : 'Eso no cumple la tarea.';
    if (state.cwd !== HOME && !t.keepCwd && !/cd/.test(t.sol)) msg += ` Ojo: estás en ${pretty(state.cwd)}, no en ~.`;
    return fallar(msg);
  }
}

const LIBRE_MSG = 'Estás en la terminal libre. Para hacer tareas con la profe abre «Práctica» (icono del escritorio).';
const META = {
  async tarea() { if (state.mode !== 'practica') return note(LIBRE_MSG); if (state.task) profeMsg(`👩‍🏫 <b>Tarea ${state.taskN}:</b> ${state.task.t}`); },
  async profe() { return META.tarea(); },
  async pista() { if (state.mode !== 'practica') return note(LIBRE_MSG); if (state.task) block('💡 Pista: ' + state.task.pista, 'verdict hint'); },
  async saltar() { if (state.mode !== 'practica') return note(LIBRE_MSG); if (!state.task) return; state.score.skip++; block('⏭ Una forma correcta era: ' + state.task.sol, 'verdict hint'); await sleep(500); await nextTask(); },
  async puntaje() { block(`📊 Aciertos: ${state.score.ok} · Errores: ${state.score.bad} · Saltadas: ${state.score.skip}`, 'verdict info'); },
  async reiniciar() { state.fs = makeFS(); state.cwd = HOME; state.installed = new Set(BASE_PKGS); state.sudoOK = false; state.vars = {}; renderPrompt(); block('🔄 Archivos y paquetes reiniciados como al inicio.', 'verdict info'); },
};
async function metaFromButton(name) {
  if (state.busy || state.ask) { toast('Espera a que termine el comando (o usa Ctrl+C)'); return; }
  state.busy = true; renderInputMode();
  echoCommand(name);
  try { await META[name](); } finally { state.busy = false; renderInputMode(); focusInput(); }
}

/* =====================================================================
   VENTANAS
   ===================================================================== */
const WM = {
  wins: {}, z: 10, cascade: 0,
  open(id, { title, icon, w = 760, h = 500, build, onClose, onOpen }) {
    if (this.wins[id]) { this.wins[id].el.classList.remove('min'); this.focus(id); return this.wins[id]; }
    const host = $('#windows'), hb = host.getBoundingClientRect();
    w = Math.min(w, hb.width - 24); h = Math.min(h, hb.height - 100);
    const off = (this.cascade++ % 5) * 28;
    const x = Math.max(8, (hb.width - w) / 2 - 60 + off + (hb.width > 1100 ? 80 : 0)), y = Math.max(10, (hb.height - h) / 2 - 40 + off);
    const svg = p => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">${p}</svg>`;
    const tEl = el('span', { class: 't', text: title });
    const bMin = el('button', { class: 'wbtn', 'aria-label': 'Minimizar', html: svg('<path d="M3.5 8.5h9"/>') });
    const bMax = el('button', { class: 'wbtn max-b', 'aria-label': 'Maximizar', html: svg('<rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/>') });
    const bClose = el('button', { class: 'wbtn close', 'aria-label': 'Cerrar', html: svg('<path d="M4 4l8 8M12 4l-8 8"/>') });
    const ic = el('span', { class: 'wi ic', 'data-ic': icon });
    const bar = el('div', { class: 'win-title' }, ic, tEl, bMin, bMax, bClose);
    const body = el('div', { class: 'win-body' });
    const win = el('div', { class: 'win', role: 'dialog', 'aria-label': title }, bar, body);
    win.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    host.append(win); paintIcons(win);
    const rec = this.wins[id] = { el: win, onClose, setTitle: s => { tEl.textContent = s; }, setIcon: k => { ic.dataset.ic = k; ic.innerHTML = ICONS[k] || ''; } };
    build(body, win);
    bMin.onclick = () => { win.classList.add('min'); this.dock(); };
    bMax.onclick = () => win.classList.toggle('max');
    bClose.onclick = () => this.close(id);
    bar.addEventListener('dblclick', e => { if (!e.target.closest('.wbtn') && !isMobile()) win.classList.toggle('max'); });
    win.addEventListener('pointerdown', () => this.focus(id), true);
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('.wbtn') || isMobile() || win.classList.contains('max') || e.button !== 0) return;
      const r = win.getBoundingClientRect(), pr = host.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
      bar.setPointerCapture(e.pointerId);
      const mv = ev => { win.style.left = Math.max(-r.width + 90, Math.min(ev.clientX - pr.left - ox, pr.width - 90)) + 'px'; win.style.top = Math.max(0, Math.min(ev.clientY - pr.top - oy, pr.height - 40)) + 'px'; };
      const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); };
      bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
    });
    this.focus(id); this.dock();
    if (onOpen) onOpen(rec);
    return rec;
  },
  focus(id) { const w = this.wins[id]; if (!w) return; if (id === 'term' || id === 'prac') { if (!activate(id === 'prac' ? 'practica' : 'libre')) return; } Object.values(this.wins).forEach(x => x.el.classList.remove('focused')); w.el.classList.add('focused'); w.el.style.zIndex = ++this.z; this.top = id; },
  close(id) { const w = this.wins[id]; if (!w) return; if (w.onClose) w.onClose(); w.el.remove(); delete this.wins[id]; this.dock(); },
  dock() { $$('.dk').forEach(b => b.classList.toggle('open', !!this.wins[b.dataset.dock])); },
};

function termTitle() { return (state.mode === 'practica' ? 'Práctica — ' : '') + 'kali@kali: ' + pretty(state.cwd); }
function openTerminal(mode = 'libre') {
  if (!activate(mode)) { const w = WM.wins[SES[mode].win]; if (w) { w.el.classList.remove('min'); } return; }
  const ses = cur;
  WM.open(ses.win, {
    title: termTitle(), icon: mode === 'practica' ? 'prac' : 'term', w: 880, h: 560,
    build: body => { if (!ses.root) { ses.root = buildTerminal(); if (mode === 'libre') T.bar.style.display = 'none'; } body.append(ses.root); },
  });
  renderPrompt(); WM.dock(); setTimeout(focusInput, 80);
  if (!ses.started && !state.busy) { ses.started = true; mode === 'practica' ? startPractice() : startFree(); }
}
function banner(sub) {
  out('');
  outParts([{ t: '  ██ ', c: 'pu' }, { t: 'KALI LAB · PROG. VI', c: 'head' }]);
  outParts([{ t: '  ██ ', c: 'pu' }, { t: sub, c: 'dim' }]);
  out('');
}
async function startFree() {
  banner('Terminal libre · simulador de Kali Linux');
  note('Aquí no hay tareas: practica lo que quieras o sigue el tutorial en PDF. Esta terminal es independiente de «Práctica».');
  note('Escribe «ayuda» para ver los comandos disponibles. Tab autocompleta · ↑ ↓ historial · Ctrl+C detiene.');
}
async function startPractice() {
  banner('Práctica con la profe · ' + TAREAS.length + ' tareas al azar');
  note('La profe te pide algo → escribe el comando → presiona Enter → te dice si está bien.');
  note('Comandos de la práctica: tarea · pista · saltar · puntaje · reiniciar · ayuda');
  state.busy = true; renderInputMode();
  try { await nextTask(); } finally { state.busy = false; renderInputMode(); focusInput(); }
}

function buildEditor(body, { text, readonly, path, sudo }) {
  const st = state;
  const root = el('div', { class: 'editor' });
  const gutter = el('div', { class: 'gutter' });
  let area;
  const status = el('span', { text: readonly ? 'Solo lectura' : 'Editando' });
  const saveBtn = readonly ? null : el('button', { text: '💾 Guardar', onclick: save });
  let fs = parseFloat(store.get('ed_fs')) || (isMobile() ? 12.5 : 13.5);
  const setFs = v => { fs = Math.max(10, Math.min(20, v)); root.style.setProperty('--edfs', fs + 'px'); store.set('ed_fs', fs); };
  const menu = el('div', { class: 'menubar' },
    ...['Archivo', 'Editar', 'Buscar', 'Ver', 'Documento', 'Ayuda'].map(m => el('span', { text: m, class: 'tb-hide-m' })),
    el('span', { class: 'sp' }),
    el('button', { text: 'A−', title: 'Letra más pequeña', onclick: () => setFs(fs - 1) }),
    el('button', { text: 'A+', title: 'Letra más grande', onclick: () => setFs(fs + 1) }),
    saveBtn);
  if (readonly) area = el('pre', { class: 'edtext', text });
  else { area = el('textarea', { class: 'edtext', spellcheck: 'false' }); area.value = text; }
  const wrap = el('div', { class: 'edwrap' }, gutter, area);
  const lines = () => { const n = (readonly ? text : area.value).split('\n').length; gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n'); if (!readonly) { area.style.height = 'auto'; area.style.height = area.scrollHeight + 'px'; } };
  if (!readonly) area.addEventListener('input', () => { lines(); status.textContent = 'Modificado (sin guardar)'; });
  if (!readonly) area.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
  function save() { const prev = state; state = st; try { save2(); } finally { state = prev; } }
  function save2() {
    const [pa, nm] = splitPath(path), p = getNode(pa);
    if (!p || p.t !== 'd') { toast('No existe la carpeta ' + pretty(pa)); return; }
    if (needsRoot(pa) && !sudo) { toast('Permission denied: abre el editor con sudo (sudo nano ' + pretty(path) + ')'); return; }
    if (p.c[nm]) p.c[nm].d = area.value; else p.c[nm] = F(area.value);
    status.textContent = 'Guardado ✔'; toast('Guardado: ' + pretty(path));
  }
  root.append(menu, wrap, el('div', { class: 'status' }, status, el('span', { text: 'UTF-8 · ' + (readonly ? 'Texto plano' : pretty(path)) })));
  body.append(root); setFs(fs); setTimeout(lines, 0);
  if (!readonly) setTimeout(() => area.focus(), 80);
}
function openComandos() { WM.open('txt', { title: 'comandos.txt — Mousepad', icon: 'txt', w: 640, h: 600, build: b => buildEditor(b, { text: COMANDOS_TXT, readonly: true }) }); }
function openEditor(abs, sudo) {
  const n = getNode(abs);
  WM.open('ed:' + abs, { title: splitPath(abs)[1] + ' — ' + (sudo ? 'nano (root)' : 'nano'), icon: 'txt', w: 620, h: 440, build: b => buildEditor(b, { text: n ? n.d : '', readonly: false, path: abs, sudo }), onClose: () => setTimeout(() => { if (WM.wins[cur.win]) focusInput(); }, 50) });
}
const APPS = { term: () => openTerminal('libre'), prac: () => openTerminal('practica'), txt: openComandos };


/* =====================================================================
   ARRANQUE
   ===================================================================== */
paintIcons();
const menu = $('#appmenu'), btnMenu = $('#btnMenu');
const closeMenu = () => { menu.classList.remove('open'); btnMenu.setAttribute('aria-expanded', 'false'); };
btnMenu.addEventListener('click', e => { e.stopPropagation(); const o = !menu.classList.contains('open'); menu.classList.toggle('open', o); btnMenu.setAttribute('aria-expanded', String(o)); });
document.addEventListener('click', e => {
  const op = e.target.closest('[data-open]'); if (op) { closeMenu(); APPS[op.dataset.open](); return; }
  const dk = e.target.closest('[data-dock]');
  if (dk) {
    const id = dk.dataset.dock;
    const w = WM.wins[id], isTerm = id === 'term' || id === 'prac';
    if (!w) APPS[id]();
    else if (w.el.classList.contains('min')) { if (isTerm) APPS[id](); else { w.el.classList.remove('min'); WM.focus(id); } }
    else if (WM.top === id) { w.el.classList.add('min'); }
    else if (isTerm) APPS[id]();
    else WM.focus(id);
    return;
  }
  if (!e.target.closest('#appmenu')) closeMenu();
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.altKey && (e.key === 't' || e.key === 'T')) { e.preventDefault(); openTerminal('libre'); }
  if (e.key === 'Escape') closeMenu();
});
const tick = () => { const d = new Date(); $('#clock').textContent = d.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '') + '  ' + d.toTimeString().slice(0, 5); };
tick(); setInterval(tick, 15000);
setTimeout(() => { if (!WM.wins.term) toast('👋 «Práctica» = tareas con la profe · «Terminal» = consola libre para practicar', 6000); }, 700);

// Para pruebas automáticas
window.__kali = { get state() { return state; }, SES, runLine, CMDS, TAREAS, openTerminal, nextTask, renderInputMode };
})();
</script>
